<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop Watch</title>
    <style>
        body{
            background-color: #edeaff;
        }
        .stopwatch{
            width: 90%;
            max-width: 600px;
            background-image: linear-gradient(rgba(0,0,0,0.8),rgba(0,0,0,0.8)),
            url(./water.png);
            background-size: cover;
            background-position: center;
            text-align: center;
            padding: 40px 0px;
            color: #fff;
            margin: 200px auto 0;
            box-shadow: 0px 10px 10px rgba(0, 0, 0, 0.2);
        }
        .stopwatch h1{
            margin-top: 10px;
            font-size: 64px;
            font-weight: 300;
        }
        .buttons{
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .buttons img{
            width: 50px;
            margin: 0px 20px;
            cursor: pointer;
        }
        .buttons img:nth-child(2){
            width: 80px;
        }
    </style>
</head>
<body>
    
    <div class="stopwatch">
        <h1 id="displayTime">00:00:00</h1>
        <div class="buttons">
            <img src="./stop.jpg" onclick="watchStop()">
            <img src="./play.png" onclick="startWatch()">
            <img src="./reset.png" onclick="watchReset()">
        </div>
    </div>

    <script>

        let[seconds,minutes,hours] = [0,0,0];
        let displayTime = document.getElementById("displayTime");
        let timer = null;

        function stopwatch(){
            seconds++;
            if(seconds == 60){
                seconds = 0;
                minutes++;
                if(minutes == 60){
                    minutes = 0;
                    hours++;
                }
            }        

            let h = hours < 10 ? "0" + hours : hours;
            let m = minutes < 10 ? "0" + minutes : minutes;
            let s = seconds < 10 ? "0" + seconds : seconds;
            
            displayTime.innerHTML = h + ":" + m + ":" + s;
        }

        function startWatch(){
            if(timer !== null){
                clearInterval(timer);
            }
           timer = setInterval(stopwatch,1000);
        }

        function watchStop(){
            clearInterval(timer);
        }

        function watchReset(){
            clearInterval(timer);
            [seconds,minutes,hours] = [0,0,0];
            displayTime.innerHTML = "00:00:00";
        }

    </script>

</body>
</html>
